<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(to right, rgba(44, 141, 196, 0.6), rgba(66, 88, 214, 0.6)), #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
  }
  .topbar {
    height: 70px;
    width: 100%;
    background: linear-gradient(to right, rgba(44, 141, 196, 0.65), rgba(66, 88, 214, 0.65));
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-wordmark {
    height: 46px;
    width: auto;
    display: block;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: #ffffff;
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    padding: 10px 0;
  }
  .nav-link:hover {
    color: #ffffff;
  }
  .nav-link.active {
    color: #ffffff;
    font-weight: 500;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  .download-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #2c8dc4;
    background: #ffffff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
  }
  .download-link:hover {
    background: #eaf4fa;
  }

  .hero {
    height: 65vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 260px 24px 40px;
  }
  .hero-content {
    max-width: 1250px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: headline-in 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s both;
  }
  @keyframes headline-in {
    0%   { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-content {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
  .headline {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 60px;
    font-weight: 500;
    line-height: 1.28;
    letter-spacing: -0.01em;
    color: #fbf7ee;
    text-align: center;
    margin: 0;
  }
  .hl {
    position: relative;
    display: inline-block;
  }
  .hl svg {
    position: absolute;
    overflow: visible;
    pointer-events: none;
  }
  .hl-underline svg {
    left: 0;
    bottom: -12px;
    width: 100%;
    height: 20px;
  }
  .hl-zigzag svg {
    left: 0;
    bottom: -10px;
    width: 100%;
    height: 14px;
  }
  .hl-circle svg {
    left: -16px;
    top: -14px;
    width: calc(100% + 32px);
    height: calc(100% + 26px);
  }
  .hl path {
    stroke: #ffffff;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.7;
  }

  .cta-button {
    display: inline-block;
    margin-top: 44px;
    font-size: 18px;
    font-weight: 600;
    color: #2c6fa8;
    background: #ffffff;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }
  .cta-button:hover {
    background: #eaf4fa;
  }
  .cta-subtitle {
    margin-top: 12px;
    font-size: 17px;
    font-weight: 400;
    color: #ffffff;
  }

  .scroll-spacer {
    height: 65vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }
  .next-content {
    max-width: 560px;
    padding-top: 120px;
    text-align: left;
    opacity: 0;
    will-change: opacity, transform, filter;
  }
  .next-headline {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #fbf7ee;
    margin: 0;
  }
  .next-subtitle {
    font-size: 22px;
    font-weight: 400;
    color: #ffffff;
    margin: 14px 0 0 0;
  }
  .media-collage {
    position: relative;
    width: 360px;
    height: 340px;
    flex-shrink: 0;
    opacity: 0;
    will-change: opacity, transform, filter;
  }
  .media-card {
    position: absolute;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  }

  .scroll-spacer-2 {
    height: 65vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }
  .stage3-content {
    max-width: 560px;
    padding-top: 120px;
    text-align: right;
    opacity: 0;
    will-change: opacity, transform, filter;
  }
  .stage3-headline {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #fbf7ee;
    margin: 0;
  }
  .stage3-subtitle {
    font-size: 22px;
    font-weight: 400;
    color: #ffffff;
    margin: 14px 0 0 0;
  }
  .end-spacer {
    height: 50vh;
    width: 100%;
  }
</style>
</head>

      <div class="media-card" style="width:190px; height:240px; left:0; top:60px; transform:rotate(-6deg); background:linear-gradient(160deg, #4258d6, #2c8dc4);"></div>
      <div class="media-card" style="width:190px; height:240px; left:110px; top:20px; transform:rotate(4deg); background:linear-gradient(160deg, #7896f0, #4258d6);"></div>
      <div class="media-card" style="width:160px; height:200px; left:200px; top:110px; transform:rotate(-3deg); background:linear-gradient(160deg, #2c8dc4, #1a5f85);"></div>
    </div>
  </div>

  <div class="scroll-spacer-2">
    <div class="media-collage" id="stage3Media">
      <div class="media-card" style="width:190px; height:240px; left:0; top:20px; transform:rotate(5deg); background:linear-gradient(160deg, #2c8dc4, #4258d6);"></div>
      <div class="media-card" style="width:190px; height:240px; left:110px; top:70px; transform:rotate(-4deg); background:linear-gradient(160deg, #4258d6, #7896f0);"></div>
      <div class="media-card" style="width:160px; height:200px; left:200px; top:10px; transform:rotate(3deg); background:linear-gradient(160deg, #1a5f85, #2c8dc4);"></div>
    </div>
    <div class="stage3-content">
      <h1 class="stage3-headline">...all natively local to you</h1>
      <p class="stage3-subtitle">&rarr; Privacy Policy</p>
    </div>
  </div>
  <div class="end-spacer"></div>

  <script>
    (function() {
      if (window.history && 'scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      var hero = document.querySelector('.hero-content');
      var stage2 = document.querySelector('.next-content');
      var stage2Media = document.getElementById('stage2Media');
      var stage3 = document.querySelector('.stage3-content');
      var stage3Media = document.getElementById('stage3Media');
      var FADE_RANGE = 230; // px of scroll over which a section fades in/out
      // The hero fades out over a longer distance so it overlaps more with
      // "Speed and power..." fading in, softening that first handoff without
      // fully blending the two sections together. Scaled to viewport height so
      // the overlap stays consistent on taller screens (where sections sit
      // further apart).
      function heroFadeRange() {
        return window.innerHeight * 0.5;
      }
      var ticking = false;

      // The hero's entrance animation uses fill-mode "both", which holds its
      // final keyframe value and overrides inline styles set by JS forever
      // (CSS animations win the cascade over normal inline styles). Once the
      // entrance animation finishes, drop it so scroll-driven opacity works.
      if (hero) {
        hero.addEventListener('animationend', function() {
          hero.style.animation = 'none';
        });
      }

      var PLATEAU = 105; // px around the anchor where content stays fully solid (no blur)

      function sectionProgress(el, anchorFraction, fadeOutOnly, fadeRange) {
        var rect = el.getBoundingClientRect();
        var center = rect.top + rect.height / 2;
        var viewportAnchor = window.innerHeight * (anchorFraction === undefined ? 0.5 : anchorFraction);
        var range = fadeRange || FADE_RANGE;
        // fadeOutOnly: element is fully clear until it has scrolled UP past its
        // anchor, so it never starts blurred on page load (used for the hero).
        if (fadeOutOnly && center >= viewportAnchor) return 1;
        var offset = Math.abs(center - viewportAnchor);
        if (offset <= PLATEAU) return 1;
        return Math.max(0, 1 - (offset - PLATEAU) / range);
      }

      // Apply a soft "materialize" treatment (fade + gentle scale-up + lift +
      // unblur) instead of a flat opacity snap, so content dissolves into
      // place the way it does on the Apple reference. Text and its paired
      // image collage are passed the exact same progress value so they move
      // as a single unit rather than fading independently.
      function materialize(el, progress) {
        if (!el) return;
        var p = Math.max(0, Math.min(1, progress));
        el.style.opacity = String(p);
        var scale = 0.94 + 0.06 * p;
        var lift = (1 - p) * 16;
        el.style.transform = 'translateY(' + lift + 'px) scale(' + scale + ')';
        el.style.filter = 'blur(' + (8 * (1 - p)) + 'px)';
      }

      function applyFade() {
        if (hero) materialize(hero, sectionProgress(hero, 0.38, true, heroFadeRange()));

        var stage2Progress = stage2 ? sectionProgress(stage2, 0.22) : 0;
        materialize(stage2, stage2Progress);
        materialize(stage2Media, stage2Progress);

        var stage3Progress = stage3 ? sectionProgress(stage3, 0.22) : 0;
        materialize(stage3, stage3Progress);
        materialize(stage3Media, stage3Progress);

        ticking = false;
      }

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(applyFade);
          ticking = true;
        }
      }, { passive: true });
      window.addEventListener('resize', applyFade);

      applyFade();

      // --- Scroll resistance -------------------------------------------------
      // Make it easier to land on the "sweet spot" where a section is fully
      // sharp: scrolling is damped while content is clear, and runs at normal
      // speed while it's blurred between sections.
      var reduceMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!reduceMotion) {
        var MIN_SPEED = 0.32; // multiplier when content is fully sharp
        var MAX_SPEED = 1;    // multiplier when fully blurred

        function currentClarity() {
          var vals = [];
          if (hero)   vals.push(sectionProgress(hero, 0.38, true, heroFadeRange()));
          if (stage2) vals.push(sectionProgress(stage2, 0.22));
          if (stage3) vals.push(sectionProgress(stage3, 0.22));
          return vals.length ? Math.max.apply(null, vals) : 0;
        }

        var snapTimer = null;
        var snapAnim = null;

        // Ideal scroll position for each section — where it sits perfectly in
        // its "sweet spot". The hero's ideal spot is simply the top of the page.
        function snapTargets() {
          var targets = [0];
          var docMax = document.documentElement.scrollHeight - window.innerHeight;
          [[stage2, 0.22], [stage3, 0.22]].forEach(function(pair) {
            var el = pair[0];
            if (!el) return;
            var rect = el.getBoundingClientRect();
            var centerDoc = rect.top + window.scrollY + rect.height / 2;
            var target = centerDoc - window.innerHeight * pair[1];
            targets.push(Math.max(0, Math.min(docMax, target)));
          });
          return targets;
        }

        function cancelSnap() {
          if (snapAnim) {
            cancelAnimationFrame(snapAnim);
            snapAnim = null;
          }
        }

        function animateTo(target) {
          var start = window.scrollY;
          var dist = target - start;
          if (Math.abs(dist) < 2) return;
          var duration = 380;
          var t0 = null;
          cancelSnap();
          function step(ts) {
            if (t0 === null) t0 = ts;
            var p = Math.min(1, (ts - t0) / duration);
            // easeOutCubic — decisive at first, settling gently into place
            var eased = 1 - Math.pow(1 - p, 3);
            window.scrollTo(0, start + dist * eased);
            if (p < 1) {
              snapAnim = requestAnimationFrame(step);
            } else {
              snapAnim = null;
            }
          }
          snapAnim = requestAnimationFrame(step);
        }

        function scheduleSnap() {
          clearTimeout(snapTimer);
          snapTimer = setTimeout(function() {
            var y = window.scrollY;
            var targets = snapTargets();
            var best = null, bestDist = Infinity;
            targets.forEach(function(t) {
              var d = Math.abs(t - y);
              if (d < bestDist) { bestDist = d; best = t; }
            });
            // Only pull into place if we're already reasonably close, so it
            // never yanks the page while someone is scrolling somewhere else.
            if (best !== null && bestDist < window.innerHeight * 0.45) {
              animateTo(best);
            }
          }, 120);
        }

        window.addEventListener('wheel', function(e) {
          if (e.ctrlKey) return; // let pinch-zoom through untouched
          cancelSnap();
          var clarity = currentClarity();
          var speed = MAX_SPEED - (MAX_SPEED - MIN_SPEED) * clarity;
          // Only intervene when there's meaningful damping to apply, so normal
          // scrolling stays completely native everywhere else.
          if (speed <= 0.95) {
            e.preventDefault();
            window.scrollBy(0, e.deltaY * speed);
          }
          scheduleSnap();
        }, { passive: false });

        // Don't fight the user if they grab the scrollbar or use the keyboard.
        ['mousedown', 'touchstart', 'keydown'].forEach(function(evt) {
          window.addEventListener(evt, cancelSnap, { passive: true });
        });
      }
    })();
  </script>
</body>
</html>
