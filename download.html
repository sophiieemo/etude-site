<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    height: 70px;
    width: 100%;
    background: linear-gradient(to right, rgba(44, 141, 196, 0.78), rgba(66, 88, 214, 0.78));
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-text {
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .nav-caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 7px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
    transition: transform 0.2s ease;
  }
  .nav-dropdown:hover .nav-caret,
  .nav-dropdown:focus-within .nav-caret {
    transform: rotate(180deg);
  }
  .nav-menu {
    position: absolute;
    top: 100%;
    left: -14px;
    min-width: 170px;
    padding: 8px;
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(20, 50, 120, 0.22);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 60;
  }
  /* bridges the gap so the menu doesn't close while moving the cursor to it */
  .nav-dropdown::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 14px;
  }
  .nav-dropdown:hover .nav-menu,
  .nav-dropdown:focus-within .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-menu a {
    display: block;
    padding: 9px 14px;
    border-radius: 8px;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #1a2b4a;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-menu a:hover {
    background: #eef3fb;
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: #ffffff;
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    padding: 10px 0;
  }
  .nav-link:hover {
    color: #ffffff;
  }
  .nav-link.active {
    color: #ffffff;
    font-weight: 600;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  .download-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #2c8dc4;
    background: #ffffff;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    display: inline-block;
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.16s ease, box-shadow 0.16s ease;
  }
  .download-link:hover {
    background: #eaf4fa;
    transform: translateY(-1px);
  }
  /* small lift on press, for a bit of flare */
  .download-link:active {
    transform: translateY(-4px);
    box-shadow: 0 6px 14px rgba(20, 60, 140, 0.22);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="nav-group-left">
      <div class="logo-spot"><a href="index.html" class="logo-link"><span class="logo-text">Étude</span></a></div>
      <div class="nav-left">
      <span class="nav-dropdown"><a href="resources.html" class="nav-link ">Resources<span class="nav-caret"></span></a><div class="nav-menu"><a href="resources.html">Docs</a><a href="#">Blog</a></div></span>
      <a href="models.html" class="nav-link ">Models</a>
      <a href="community.html" class="nav-link ">Community</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="download.html" class="download-link active">Download</a>
    </div>
  </div>

  <script>
    (function() {
      var navLeft = document.querySelector('.nav-left');
      if (!navLeft) return;
      var links = navLeft.querySelectorAll('.nav-link');
      var indicator = document.createElement('div');
      indicator.className = 'nav-indicator';
      navLeft.appendChild(indicator);

      function moveIndicatorTo(el) {
        if (!el) {
          indicator.style.width = '0';
          return;
        }
        // Measured against .nav-left rather than offsetLeft, since the
        // Resources dropdown wrapper is itself positioned and would
        // otherwise become the offset parent.
        var navRect = navLeft.getBoundingClientRect();
        var rect = el.getBoundingClientRect();
        indicator.style.left = (rect.left - navRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }

      var activeLink = navLeft.querySelector('.nav-link.active');
      moveIndicatorTo(activeLink);

      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          moveIndicatorTo(link);
        });
      });
      navLeft.addEventListener('mouseleave', function() {
        moveIndicatorTo(activeLink);
      });
      window.addEventListener('resize', function() {
        moveIndicatorTo(activeLink);
      });
    })();
  </script>
</body>
</html>
