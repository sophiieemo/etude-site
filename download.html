<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    /* floating dock rather than a full-width strip */
    position: sticky;
    top: 14px;
    z-index: 200;
    height: 66px;
    width: calc(100% - 40px);
    max-width: 1240px;
    margin: 14px auto 0;
    border-radius: 999px;
    background: linear-gradient(to right, rgba(44, 141, 196, 0.78), rgba(66, 88, 214, 0.78));
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 28px rgba(20, 50, 130, 0.18),
                inset 0 1px 8px rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 26px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-text {
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .nav-caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 7px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
    transition: transform 0.2s ease;
  }
  .nav-dropdown:hover .nav-caret,
  .nav-dropdown:focus-within .nav-caret,
  .nav-dropdown.is-open .nav-caret {
    transform: rotate(180deg);
  }
  .nav-menu {
    position: absolute;
    top: 100%;
    left: -14px;
    min-width: 170px;
    /* top padding replaces the old margin, so the menu box touches the
       trigger and there's no dead zone to cross */
    padding: 12px 8px 8px;
    margin-top: 0;
    /* white liquid glass, matching the dock it hangs from */
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(20, 50, 130, 0.20),
                inset 0 1px 10px rgba(255, 255, 255, 0.30);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 60;
  }
  .nav-dropdown:hover .nav-menu,
  .nav-dropdown:focus-within .nav-menu,
  .nav-dropdown.is-open .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-menu a {
    display: block;
    padding: 9px 14px;
    border-radius: 8px;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: #1a1a1a;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s ease;
  }
  .nav-menu a:hover {
    background: rgba(255, 255, 255, 0.45);
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: #ffffff;
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 21px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    padding: 10px 0;
  }
  .nav-link:hover {
    color: #ffffff;
  }
  .nav-link.active {
    color: #ffffff;
    font-weight: 600;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  /* same liquid-glass treatment as the hero CTA, scaled down */
  .download-link {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-block;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: #ffffff;
    text-decoration: none;
    padding: 10px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 6px 18px rgba(20, 50, 130, 0.18),
                inset 0 1px 6px rgba(255, 255, 255, 0.14);
    text-shadow: 0 1px 6px rgba(20, 50, 130, 0.35);
    transition: transform 0.5s cubic-bezier(0.34, 1.7, 0.5, 1),
                background 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
  }
  .download-link::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset -8px -6px 0 -10px rgba(255, 255, 255, 0.55),
                inset 0 -7px 0 -7px rgba(255, 255, 255, 0.45);
    opacity: 0.35;
    filter: blur(1px);
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.35s ease;
  }
  .download-link:hover {
    transform: translateY(-2px) scale(1.04);
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.38);
    box-shadow: 0 10px 24px rgba(20, 50, 130, 0.24),
                inset 0 1px 10px rgba(255, 255, 255, 0.22);
  }
  .download-link:hover::before {
    opacity: 0.6;
  }
  /* press squishes the glass, then it springs back */
  .download-link:active {
    transform: translateY(0) scale(0.95);
    transition: transform 0.11s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .download-link {
      transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .download-link:hover,
    .download-link:active {
      transform: none;
    }
  }

</style>
</head>
<body>
  <div class="topbar">
    <div class="nav-group-left">
      <div class="logo-spot"><a href="index.html" class="logo-link"><span class="logo-text">Étude</span></a></div>
      <div class="nav-left">
      <span class="nav-dropdown"><a href="resources.html" class="nav-link ">Resources<span class="nav-caret"></span></a><div class="nav-menu"><a href="resources.html">Docs</a><a href="#">Blog</a></div></span>
      <a href="models.html" class="nav-link ">Models</a>
      <a href="community.html" class="nav-link ">Community</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="download.html" class="download-link active">Download</a>
    </div>
  </div>

  <script>
    (function() {
      var navLeft = document.querySelector('.nav-left');
      if (!navLeft) return;
      var links = navLeft.querySelectorAll('.nav-link');
      var indicator = document.createElement('div');
      indicator.className = 'nav-indicator';
      navLeft.appendChild(indicator);

      function moveIndicatorTo(el) {
        if (!el) {
          indicator.style.width = '0';
          return;
        }
        // Measured against .nav-left rather than offsetLeft, since the
        // Resources dropdown wrapper is itself positioned and would
        // otherwise become the offset parent.
        var navRect = navLeft.getBoundingClientRect();
        var rect = el.getBoundingClientRect();
        indicator.style.left = (rect.left - navRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }

      var activeLink = navLeft.querySelector('.nav-link.active');
      moveIndicatorTo(activeLink);

      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          moveIndicatorTo(link);
        });
      });
      navLeft.addEventListener('mouseleave', function() {
        moveIndicatorTo(activeLink);
      });
      window.addEventListener('resize', function() {
        moveIndicatorTo(activeLink);
      });
    })();
  </script>



  <script>
    (function() {
      var dd = document.querySelector('.nav-dropdown');
      if (!dd) return;
      var timer;
      function open() { clearTimeout(timer); dd.classList.add('is-open'); }
      function close() {
        clearTimeout(timer);
        // brief grace period so moving the cursor toward the menu
        // (or across any gap) doesn't dismiss it
        timer = setTimeout(function() { dd.classList.remove('is-open'); }, 260);
      }
      dd.addEventListener('mouseenter', open);
      dd.addEventListener('mouseleave', close);
      dd.addEventListener('focusin', open);
      dd.addEventListener('focusout', close);
    })();
  </script>
</body>
</html>
